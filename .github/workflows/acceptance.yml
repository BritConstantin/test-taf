name: Acceptance against external SUT (expected red when absent)
on:
  workflow_dispatch:
    inputs:
      sut_base_url:
        description: Reachable SUT origin configured for the runner-local provider stub and fixed clock
        required: true
        default: http://127.0.0.1:3000
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUT_BASE_URL: ${{ inputs.sut_base_url }}
      PROVIDER_STUB_PORT: '4400'
      API_REQUEST_TIMEOUT_MS: '2500'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:acceptance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-reports
          path: reports/
          if-no-files-found: warn
